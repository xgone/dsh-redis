# Example only: copy this file to a local patch and replace the placeholders.
# Do not commit real usernames or passwords.
- insert:
    - id: redis
      name: 'dsh-redis'
      config:
        connections:
          - name: local
            url: 'redis://127.0.0.1:6379/10'
            username: 'default'
            password: '<local-redis-password>'
          - name: test
            url: 'redis://redis.example.com:6379/10'
            username: 'default'
            password: '<test-redis-password>'
        defaultConnection: local
        maxScanKeys: 1000
        maxCollectionItems: 1000
        maxStringLength: 1000000
        operationTimeoutMs: 30000
        writeApproval: true
