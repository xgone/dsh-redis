# Safe default bundle patch. Add private endpoints and credentials in your DSH profile patch.
- insert:
    - id: redis
      name: 'dsh-redis'
      config:
        connections:
          - name: local
            url: 'redis://127.0.0.1:6379/0'
          - name: remote
            url: !!js >-
              process.env.DSH_REDIS_URL_REMOTE || 'redis://127.0.0.1:6379/10'
            password: !!js >-
              process.env.DSH_REDIS_PASSWORD_REMOTE || ''
        defaultConnection: local
        maxScanKeys: 1000
        maxCollectionItems: 1000
        maxStringLength: 1000000
        operationTimeoutMs: 30000
        writeApproval: true
